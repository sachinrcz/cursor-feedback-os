<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor — Feedback</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        :root {
            --cursor-bg: #14120b;
            --cursor-bg-dark: #0f0d06;
            --cursor-surface: #1c1a12;
            --cursor-surface-raised: #262318;
            --cursor-text: #edecec;
            --cursor-text-muted: rgba(237, 236, 236, 0.55);
            --cursor-border: rgba(237, 236, 236, 0.12);
            --cursor-border-emphasis: rgba(237, 236, 236, 0.15);
            --cursor-accent: #f54e00;
            --cursor-accent-hover: #ff6a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--cursor-bg);
            color: var(--cursor-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: var(--cursor-surface);
            border-radius: 12px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
            max-width: 560px;
            width: 100%;
            padding: 40px 36px;
            border: 1px solid var(--cursor-border-emphasis);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--cursor-accent);
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--cursor-text);
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .subtitle {
            text-align: center;
            color: var(--cursor-text-muted);
            margin-bottom: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--cursor-text);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--cursor-border-emphasis);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: var(--cursor-bg-dark);
            color: var(--cursor-text);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--cursor-text-muted);
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--cursor-accent);
            box-shadow: 0 0 0 3px rgba(245, 78, 0, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .char-hint {
            text-align: right;
            margin-top: 6px;
            color: var(--cursor-text-muted);
            font-size: 0.8rem;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: var(--cursor-accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }

        .submit-btn:hover {
            background: var(--cursor-accent-hover);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            background: var(--cursor-surface-raised);
            color: var(--cursor-text-muted);
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
            border: 1px solid var(--cursor-border-emphasis);
        }

        .message.success {
            background: rgba(168, 196, 160, 0.12);
            color: #a8c4a0;
            border-color: rgba(168, 196, 160, 0.35);
            display: block;
        }

        .message.error {
            background: rgba(196, 160, 160, 0.12);
            color: #c4a0a0;
            border-color: rgba(196, 160, 160, 0.35);
            display: block;
        }

        .message.info {
            background: var(--cursor-surface-raised);
            color: var(--cursor-text);
            display: block;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--cursor-text-muted);
        }

        .footer-note a {
            color: var(--cursor-text);
            text-decoration: none;
            border-bottom: 1px solid var(--cursor-border-emphasis);
        }

        .footer-note a:hover {
            color: var(--cursor-accent);
            border-color: var(--cursor-accent);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.25);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">C</div>
            <h1>Cursor</h1>
            <p class="subtitle">Share a question or comment — we’ll print it for the room.</p>
        </div>
        
        <form id="ticketForm">
            <div class="form-group">
                <label for="from_name">Your Name</label>
                <input type="text" id="from_name" name="from_name" placeholder="Your name" autocomplete="name" required maxlength="50">
                <div class="char-hint"><span id="nameCharCount">0</span>/50</div>
            </div>
            
            <div class="form-group">
                <label for="question">Question / Comment</label>
                <textarea id="question" name="question" placeholder="What would you like to ask or share?" required maxlength="500"></textarea>
                <div class="char-hint"><span id="charCount">0</span>/500</div>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <!-- reCAPTCHA site key - Replace YOUR_RECAPTCHA_SITE_KEY with your actual key -->
                <!-- Or configure via Netlify environment variable RECAPTCHA_SITE_KEY with a build step -->
                <div class="g-recaptcha" id="recaptcha-container" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Print Ticket
            </button>
        </form>
        
        <div class="message" id="message"></div>
        <p class="footer-note">
            <a href="https://cursorindonesia.com" target="_blank" rel="noopener noreferrer">Cursor Community Indonesia</a>
        </p>
    </div>

    <script>
        const MAX_NAME_LEN = 50;
        const MAX_QUESTION_LEN = 500;
        const EMOJI_RE = /\p{Extended_Pictographic}/u;

        function containsEmoji(text) {
            return EMOJI_RE.test(text);
        }
        // Configure reCAPTCHA site key if available via environment variable
        // (Requires build step to inject - otherwise replace YOUR_RECAPTCHA_SITE_KEY above)
        if (window._env && window._env.RECAPTCHA_SITE_KEY) {
            const recaptchaContainer = document.getElementById('recaptcha-container');
            if (recaptchaContainer) {
                recaptchaContainer.setAttribute('data-sitekey', window._env.RECAPTCHA_SITE_KEY);
            }
        }
        
        // API endpoint configuration
        // This will be dynamically set based on environment
        const API_URL = (() => {
            const hostname = window.location.hostname;
            
            // Local development
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:5000';
            }
            
            // Check for Netlify environment variable
            if (window._env && window._env.REACT_APP_API_URL) {
                return window._env.REACT_APP_API_URL;
            }
            
            // In production, set this to your ngrok, Cloudflare tunnel, or exposed Raspberry Pi URL
            // Example: 'https://abc123.ngrok.io' or 'https://your-tunnel.trycloudflare.com'
            // Replace 'YOUR_API_URL_HERE' below with your actual API URL
            // OR set via Netlify environment variable REACT_APP_API_URL (requires build step)
            const productionApiUrl = 'YOUR_API_URL_HERE';
            
            return productionApiUrl || '/api';
        })();

        const form = document.getElementById('ticketForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const nameField = document.getElementById('from_name');
        const questionField = document.getElementById('question');
        const nameCharCount = document.getElementById('nameCharCount');
        const charCount = document.getElementById('charCount');
        
        nameField.addEventListener('input', () => {
            nameCharCount.textContent = nameField.value.length;
        });

        questionField.addEventListener('input', () => {
            charCount.textContent = questionField.value.length;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fromName = document.getElementById('from_name').value.trim();
            const question = document.getElementById('question').value.trim();
            
            if (!fromName) {
                showMessage('Please enter your name.', 'error');
                return;
            }
            
            if (fromName.length > MAX_NAME_LEN) {
                showMessage(`Name must be ${MAX_NAME_LEN} characters or less.`, 'error');
                return;
            }

            if (containsEmoji(fromName)) {
                showMessage('Name cannot contain emoji.', 'error');
                return;
            }
            
            if (!question) {
                showMessage('Please enter a question or comment.', 'error');
                return;
            }
            
            if (question.length > MAX_QUESTION_LEN) {
                showMessage(`Message must be ${MAX_QUESTION_LEN} characters or less.`, 'error');
                return;
            }

            if (containsEmoji(question)) {
                showMessage('Message cannot contain emoji.', 'error');
                return;
            }
            
            // Check reCAPTCHA
            const recaptchaResponse = grecaptcha.getResponse();
            if (!recaptchaResponse) {
                showMessage('Please complete the CAPTCHA verification.', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Printing...';
            
            // Log to database in parallel (don't wait for it)
            fetch('/.netlify/functions/log-ticket', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    from_name: fromName,
                    question: question
                })
            }).catch(err => console.error('Database log error:', err));
            
            try {
                const response = await fetch(`${API_URL}/submit_ticket`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from_name: fromName,
                        question: question
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message || 'Ticket printed successfully.', 'success');
                    form.reset();
                    nameCharCount.textContent = '0';
                    charCount.textContent = '0';
                    grecaptcha.reset();
                } else {
                    showMessage('Printer is either off or out of paper. Please contact the administrator to fix it!', 'error');
                }
            } catch (error) {
                showMessage('Printer is either off or out of paper. Please contact the administrator to fix it!', 'error');
                console.error('API Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Print Ticket';
            }
        });
        
        function showMessage(text, type) {
            messageDiv.innerHTML = text;
            messageDiv.className = 'message ' + type;
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
