<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor — Feedback</title>
    <style>
        :root {
            --color-theme-bg: #14120b;
            --color-theme-fg: #edecec;
            --color-theme-fg-02: #d7d6d5;
            --color-theme-card: #1b1913;
            --color-theme-card-input: #1d1b15;
            --color-theme-text-sec: rgba(237, 236, 236, 0.6);
            --color-theme-text-tertiary: rgba(237, 236, 236, 0.4);
            --color-theme-border-01: rgba(237, 236, 236, 0.08);
            --color-theme-border-02: rgba(237, 236, 236, 0.1);
            --color-theme-border-03: rgba(237, 236, 236, 0.6);
            --radius-md: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: var(--color-theme-bg);
            color: var(--color-theme-fg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--color-theme-card);
            border-radius: var(--radius-md);
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.05);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            border: 1px solid var(--color-theme-border-02);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            display: block;
            margin: 0 auto 20px;
        }

        .subtitle {
            text-align: center;
            color: var(--color-theme-fg);
            margin-bottom: 0;
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.35;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-theme-fg);
            font-weight: 500;
            font-size: 0.875rem;
            letter-spacing: 0.005em;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--color-theme-border-02);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: var(--color-theme-card-input);
            color: var(--color-theme-fg);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--color-theme-text-tertiary);
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--color-theme-border-03);
            box-shadow: 0 0 0 1px var(--color-theme-border-03);
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .char-hint {
            text-align: right;
            margin-top: 6px;
            color: var(--color-theme-text-tertiary);
            font-size: 0.75rem;
        }

        .submit-btn {
            width: 100%;
            padding: 0.89em 1.45em 0.91em;
            background: var(--color-theme-fg);
            color: var(--color-theme-bg);
            border: 1px solid var(--color-theme-fg);
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            font-family: inherit;
        }

        .submit-btn:hover {
            background: var(--color-theme-fg-02);
            border-color: var(--color-theme-fg-02);
        }

        .submit-btn:disabled {
            background: var(--color-theme-card-input);
            color: var(--color-theme-text-tertiary);
            border-color: var(--color-theme-border-02);
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: 500;
            font-size: 0.875rem;
            display: none;
            border: 1px solid var(--color-theme-border-02);
        }

        .message.success {
            background: rgba(237, 236, 236, 0.06);
            color: var(--color-theme-fg);
            border-color: var(--color-theme-border-02);
            display: block;
        }

        .message.error {
            background: rgba(237, 236, 236, 0.04);
            color: var(--color-theme-fg-02);
            border-color: var(--color-theme-border-03);
            display: block;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-theme-text-sec);
        }

        .footer-note a {
            color: var(--color-theme-text-sec);
            text-decoration: none;
            border-bottom: 1px solid var(--color-theme-border-02);
        }

        .footer-note a:hover {
            color: var(--color-theme-fg);
            border-color: var(--color-theme-fg);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(20, 18, 11, 0.25);
            border-radius: 50%;
            border-top-color: var(--color-theme-bg);
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <img src="{{ url_for('static', filename='cursor-logo.svg') }}" alt="Cursor" class="brand-logo" width="48" height="48">
            <p class="subtitle">Cafe Cursor Bali</p>
        </div>
        
        <form id="ticketForm">
            <div class="form-group">
                <label for="from_name">Your Name</label>
                <input type="text" id="from_name" name="from_name" placeholder="Your name" autocomplete="name" required maxlength="50">
                <div class="char-hint"><span id="nameCharCount">0</span>/50</div>
            </div>
            
            <div class="form-group">
                <label for="question">Comment</label>
                <textarea id="question" name="question" placeholder="Share what you learned or enjoyed…" required maxlength="500"></textarea>
                <div class="char-hint"><span id="charCount">0</span>/500</div>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                Print Ticket
            </button>
        </form>
        
        <div class="message" id="message"></div>
        <p class="footer-note">
            <a href="https://cursor.com" target="_blank" rel="noopener noreferrer">cursor.com</a>
        </p>
    </div>

    <script>
        const MAX_NAME_LEN = 50;
        const MAX_QUESTION_LEN = 500;
        const EMOJI_RE = /\p{Extended_Pictographic}/u;

        function containsEmoji(text) {
            return EMOJI_RE.test(text);
        }

        const form = document.getElementById('ticketForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const nameField = document.getElementById('from_name');
        const questionField = document.getElementById('question');
        const nameCharCount = document.getElementById('nameCharCount');
        const charCount = document.getElementById('charCount');

        nameField.addEventListener('input', () => {
            nameCharCount.textContent = nameField.value.length;
        });

        questionField.addEventListener('input', () => {
            charCount.textContent = questionField.value.length;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fromName = nameField.value.trim();
            const question = questionField.value.trim();
            
            if (!fromName) {
                showMessage('Please enter your name.', 'error');
                return;
            }

            if (fromName.length > MAX_NAME_LEN) {
                showMessage(`Name must be ${MAX_NAME_LEN} characters or less.`, 'error');
                return;
            }

            if (containsEmoji(fromName)) {
                showMessage('Name cannot contain emoji.', 'error');
                return;
            }
            
            if (!question) {
                showMessage('Please enter a question or comment.', 'error');
                return;
            }

            if (question.length > MAX_QUESTION_LEN) {
                showMessage(`Message must be ${MAX_QUESTION_LEN} characters or less.`, 'error');
                return;
            }

            if (containsEmoji(question)) {
                showMessage('Message cannot contain emoji.', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>Printing...';
            
            try {
                const response = await fetch('/submit_ticket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        from_name: fromName,
                        question: question
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.message || 'Ticket printed successfully.', 'success');
                    form.reset();
                    nameCharCount.textContent = '0';
                    charCount.textContent = '0';
                } else {
                    showMessage(data.error || 'Failed to print ticket.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Print Ticket';
            }
        });
        
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
